name: CI

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q pytest pytest-asyncio pytest-homeassistant-custom-component
      - run: pytest tests/

  # hassfest + hacs validation + HACS-sync deploy, shared with other rn-ax
  # HA integration repos rather than duplicated here -- see
  # https://github.com/rn-ax/poppycock/blob/main/.github/workflows/ha-integration-ci.yml
  ha-integration-ci:
    needs: [pytest]
    permissions:
      contents: read
      pull-requests: write
    uses: rn-ax/poppycock/.github/workflows/ha-integration-ci.yml@main
    secrets: inherit
