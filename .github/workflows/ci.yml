name: CI

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: uv sync --group dev
      - run: uv run pytest tests/

  # hassfest + hacs validation + HACS-sync deploy, shared with other rn-ax
  # HA integration repos rather than duplicated here -- see
  # https://github.com/rn-ax/poppycock/blob/main/.github/workflows/ha-integration-ci.yml
  ha-integration-ci:
    needs: [pytest]
    permissions:
      contents: read
      pull-requests: write
    uses: rn-ax/poppycock/.github/workflows/ha-integration-ci.yml@main
    secrets: inherit
